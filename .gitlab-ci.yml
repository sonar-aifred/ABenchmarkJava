# GitLab CI pipeline for self-hosted GitLab (http://localhost:8929).
# Ported from .github/workflows/ci-sonar-docker.yml.
#
# Required CI/CD variables (Settings > CI/CD > Variables):
#   SONAR_TOKEN        (masked)  SonarQube token
#   SONAR_HOST_URL               SonarQube URL reachable FROM THE RUNNER (not "localhost" if the
#                                runner is a container; e.g. http://host.docker.internal:9000)
#   SONAR_PROJECT_KEY            SonarQube project key
# Optional:
#   PUSH_IMAGE=true    push the image to the GitLab container registry (default: build only)

stages:
  - build
  - scan
  - package

default:
  interruptible: true

variables:
  GIT_DEPTH: "0" # full history for accurate blame and new code detection
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress"
  PUSH_IMAGE: "false"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never # avoid duplicate branch + MR pipelines
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

build-test:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  cache:
    key: maven-$CI_COMMIT_REF_SLUG
    paths:
      - .m2/repository
  script:
    # .mvn/extensions.xml loads maven-buildtime-extension (timings only); skip it so CI
    # doesn't fail when the extension can't be resolved.
    - rm -f .mvn/extensions.xml
    - mvn $MAVEN_CLI_OPTS spotless:check
    - mvn $MAVEN_CLI_OPTS verify
  artifacts:
    expire_in: 1 week
    paths:
      - target/

sonarqube-scan:
  stage: scan
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  needs: ["build-test"]
  cache:
    key: sonar-cache
    paths:
      - .sonar/cache
  variables:
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
  script:
    # A project-level sonar.exclusions replaces the server default (which includes
    # **/generated-sources/**). The dummy pattern matches nothing, and target/generated-sources
    # is added to sonar.sources so it is actually analysed.
    - >
      sonar-scanner
      -Dsonar.host.url="$SONAR_HOST_URL"
      -Dsonar.token="$SONAR_TOKEN"
      -Dsonar.projectKey="$SONAR_PROJECT_KEY"
      -Dsonar.sources=src/main/java,src/main/webapp,target/generated-sources
      -Dsonar.exclusions=**/__no_exclusions__/**
      -Dsonar.qualitygate.wait=true
      -Dsonar.qualitygate.timeout=300
  rules:
    - if: $SONAR_TOKEN && $SONAR_HOST_URL && $SONAR_PROJECT_KEY

docker-build:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  needs: ["build-test"]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  script:
    - docker build -t "$IMAGE" .
    - |
      if [ "$PUSH_IMAGE" = "true" ] && [ -z "$CI_MERGE_REQUEST_IID" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker push "$IMAGE"
      fi
