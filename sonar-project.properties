# Server URL is supplied by CI (secrets.SONAR_HOST_URL).
sonar.projectKey=sonar-aifred_ABenchmarkJava_3b25d64a-002e-4788-b0c1-bbd6c16f1316
sonar.sources=src/main/java,src/main/webapp
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
# Dependency jars, populated by `mvn dependency:copy-dependencies` in CI. Lets the Java analyzer
# resolve library calls (e.g. commons-text) so SCA reachability can link them to vulnerable code.
sonar.java.libraries=target/dependency/*.jar
sonar.java.test.libraries=target/dependency/*.jar
sonar.java.source=8
sonar.sourceEncoding=UTF-8
sonar.qualitygate.timeout=300
